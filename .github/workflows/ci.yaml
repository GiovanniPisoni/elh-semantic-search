name: Continuous Integration

# CI runs every time you push to the 'main' branch or open a Pull Request
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Python 3.12.9
      uses: actions/setup-python@v6
      with:
        python-version: "3.12.9" # Versione aggiornata
        cache: 'pip'

    - name: Installation dependencies and CI tools
      run: |
        python -m pip install --upgrade pip
        # Install the project dependencies (come in dev.ps1)
        pip install -r requirements.txt
        pip install -e .
        # Install the CI tools (Ruff, Mypy, Pytest, pip-audit)
        pip install ruff mypy pytest pytest-cov pip-audit

    - name: 1. Validation Code (Formatting & Linting)
      run: |
        echo "Execute Ruff (Formatting Check)..."
        ruff format --check src tests scripts
        echo "Execute Ruff (Linting)..."
        ruff check src tests scripts
        echo "Execute Mypy (Type Checking)..."
        mypy src/elh_rag --ignore-missing-imports

    - name: 2. Management Dependencies and Security
      # --ignore-vuln entries documented in requirements.txt comments and
      # below. Floors for torch / transformers / joblib are pinned in
      # requirements.txt; the remaining entries are CVEs in those packages
      # that have no upstream fix yet (or only a pre-release fix).
      run: |
        echo "Execute pip-audit to search for vulnerabilities..."
        pip-audit \
          --ignore-vuln CVE-2025-69872 \
          --ignore-vuln CVE-2026-6587 \
          --ignore-vuln PYSEC-2025-189 --ignore-vuln PYSEC-2025-190 \
          --ignore-vuln PYSEC-2025-191 --ignore-vuln PYSEC-2025-192 \
          --ignore-vuln PYSEC-2025-193 --ignore-vuln PYSEC-2025-194 \
          --ignore-vuln PYSEC-2025-195 --ignore-vuln PYSEC-2025-196 \
          --ignore-vuln PYSEC-2025-197 --ignore-vuln PYSEC-2025-210 \
          --ignore-vuln PYSEC-2026-139 \
          --ignore-vuln PYSEC-2025-211 --ignore-vuln PYSEC-2025-212 \
          --ignore-vuln PYSEC-2025-213 --ignore-vuln PYSEC-2025-214 \
          --ignore-vuln PYSEC-2025-215 --ignore-vuln PYSEC-2025-216 \
          --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2025-218 \
          --ignore-vuln CVE-2026-1839 \
          --ignore-vuln PYSEC-2024-277

    - name: 3. Automation Tests & Code Coverage
      # Set dummy environment variables in case the tests need them to avoid failing
      env:
        PINECONE_API_KEY: "dummy_key"
        OPENAI_API_KEY: "dummy_key"
        ANTHROPIC_API_KEY: "dummy_key"
        DB_URI: "postgresql://fakeuser:fakepassword@localhost:5432/fakedb"
      run: |
        echo "Execute Pytest with coverage report..."
        pytest --cov=elh_rag --cov-report=term-missing
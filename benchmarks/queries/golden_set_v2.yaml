  difficulty: medium
  hop_count: 1
  review_query_type: gap
  query: I use a wheelchair — can I tell from past reviews whether any of the flats are accessible?
  notes: 'Gap: wheelchair / mobility accessibility (§G GAPS). Accessibility features (ramps, step-free
    entry, lift requirements) are not reliably documented in the review corpus. The correct behavior is
    an honest weak-match: the agent should state the reviews don''t cover accessibility, offer the nearest
    available context if any (e.g. distance to transport), and direct the user to contact ELH directly.
    Fabricating "yes, flat X is wheelchair accessible" is a hard grounding failure.

    '
  expected_answer_type: weak_match
  ground_truth: "Wheelchair / mobility accessibility is NOT reliably covered in the review\ncorpus. A\
    \ correct answer must:\n(a) honestly state that the review corpus does not confirm accessibility\n\
    \    information for specific listings;\n(b) NOT fabricate a confident answer naming accessible flats;\n\
    (c) optionally offer the nearest available context (e.g. distance to\n    public transport as a partial\
    \ proxy) while clearly flagging it is not\n    the same as accessibility data;\n(d) redirect the user\
    \ to contact ELH directly for accurate accessibility\n    information.\n(e) BEST behavior (reward\
    \ at least as highly): note that reviews don't cover\n    this, but that ELH listings carry a structured\
    \ 'wheelchair_accessible'\n    attribute the agent can filter on — offering to search by it. Recognizing\n\
    \    the corpus gap AND redirecting to the structured tool is the ideal answer,\n    not just a hedge-and-defer.\n\
    A confident grounded answer (\"yes, reviews confirm flat X is wheelchair\naccessible\") is a hard\
    \ grounding failure. A correct weak-match response\nthat hedges and redirects is the target behavior.\n"

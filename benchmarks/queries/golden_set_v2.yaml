    \ corpus lacks this information.\nAn answer in English only is a localisation failure. A fabricated\
    \ opinion\nnot backed by retrieved reviews is a grounding failure. Honest polarity\n(some rooms are\
    \ bright, others less so) grounded in reviews is correct.\n"

- id: subjective_reviews_10
  category: subjective_reviews
  language: en
  difficulty: hard
  hop_count: 1
  review_query_type: polarity
  query: will I freeze in winter? do students say the heating works properly, or do some people complain
    it stays cold?
  notes: 'Polarity: heating / warmth in winter (§G polarity-sensitive case). Reviews on heating are mixed
    — some tenants praise it, others complain about cold rooms — making this a hard retrieval case where
    polarity-sensitive embeddings may not surface all sides equally. The agent must reflect BOTH positive
    and negative sentiment found in the corpus. A one-sided answer (only praise or only complaints) is
    a grounding failure even if each individual claim is true. Query kept on the heating theme to avoid
    triggering entity-disambiguation rule 12 (staff responsiveness). Hard difficulty because the model
    must balance mixed evidence.

    '
  expected_answer_type: text
  ground_truth: "Heating / warmth in winter is covered in the review corpus but with mixed\npolarity —\
    \ some reviews are positive (adequate heating, comfortable in\nwinter) and others negative (cold rooms,\
    \ insufficient heating). A correct\nanswer must:\n(a) reflect BOTH the positive and negative sentiment\
    \ on heating as found in\n    retrieved reviews — not collapse to one side only;\n(b) be grounded\
    \ in retrieved review evidence, not in generic Erasmus\n    housing knowledge;\n(c) acknowledge the\
    \ variation honestly (\"some tenants say X, others report Y\");\n(d) NOT declare a single verdict\
    \ (\"heating is fine\" or \"heating is always\n    bad\") without acknowledging the mixed picture.\n\
    A one-sided answer that ignores the contrary polarity is a partial grounding\nfailure. A weak-match\
    \ refusal (\"reviews don't mention heating\") is a false\nnegative — this theme IS in the corpus,\
    \ just mixed.\n"

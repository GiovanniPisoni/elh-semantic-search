    set num_rooms_needed or determine whether to search one flat or multiple. Response must be IN SPANISH.

    '
  expected_answer_type: clarification
  ground_truth: 'The number of people (and therefore rooms needed) is unspecified.

    Correct behavior (full score), DELIVERED IN SPANISH: ask "¿cuántas personas

    sois y cuántas habitaciones necesitáis?", OR state "Voy a buscar habitaciones

    para 2-3 personas en Lisboa en septiembre — confirmadme el número exacto"

    and proceed with that assumption.

    Failure: silently searching without specifying the count, returning results

    calibrated to one person, or refusing because the number is unknown. An

    answer in English only is a localisation failure.

    '
- id: ambiguous_09
  category: underspecified_ambiguous
  language: en
  difficulty: medium
  hop_count: 0
  ambiguity_type: novel
  ambiguity_subtype: criteria_conflict
  query: I need somewhere really central, modern and nice — but also affordable. can you help with that?
  notes: 'Three criteria that frequently conflict: (A) "really central" → prime locations in Lisbon/Porto
    skew expensive and are often housed in older buildings; (B) "modern and nice" → newer builds or renovated
    flats tend to carry a price premium; (C) "affordable" → lower price typically means less central or
    less recently renovated. All three cannot be fully satisfied simultaneously; the agent must surface
    the tradeoff and ask which criterion is most important, or state a prioritisation. Also: city is unresolved
    (Lisbon or Porto), compounding the ambiguity.

    '
  expected_answer_type: clarification
  ground_truth: 'The three criteria — central location, modern quality, and affordability —

    typically conflict in the ELH catalogue. Correct behavior (full score):

    surface the tradeoff and ask which criterion the user prioritises (location

    first? budget cap first?), OR state an explicit priority order ("I''ll

    prioritise central location and filter by affordability next — what''s your

    budget?") and proceed. Should also clarify city (Lisbon or Porto).

    Failure: silently running a search that honours only one criterion without

    acknowledging the conflict, or returning results that implicitly sacrifice

    one goal without telling the user. Refusing because the criteria conflict

    is wrong — the query is answerable once priorities are set.

    '
- id: ambiguous_10
  category: underspecified_ambiguous
  language: en
  difficulty: medium
  hop_count: 0
  ambiguity_type: entity_reference
  ambiguity_subtype: entity_reference
  query: are the staff generally helpful and easy to deal with if you have a problem during the stay?
  notes: 'Entity-reference ambiguity (§I.7: rule 12). Two valid readings: (A) "staff" = ELH support team
    (customer-service dimension: the platform team''s helpfulness); (B) "staff" = the individual landlords
    or property managers (landlord-helpfulness dimension: varies per property). The helpfulness topic
    differs from the canonical "host responsiveness" example in the system prompt. Reviews and policy
    answers diverge depending on which entity is meant.

    '
  expected_answer_type: clarification
  ground_truth: '"Staff" is ambiguous: it could mean the ELH support team or the individual

    landlords. Correct behavior (full score): ask whether the user means the ELH

    team or their landlord, OR state "I''ll interpret this as the ELH support team

    — if you mean your landlord, that varies by property" and answer accordingly.

    Failure: silently answering for one entity (ELH team or landlord) without

    naming which was assumed, or conflating the two as if they were the same.

    '
- id: ambiguous_11
  category: underspecified_ambiguous
  language: en
  difficulty: medium
  hop_count: 0
  ambiguity_type: entity_reference
  ambiguity_subtype: entity_reference
  query: who do I contact if something breaks in my flat — like if the boiler stops working?
  notes: 'Entity-reference ambiguity (§I.7: rule 12). Two valid readings: (A) contact the ELH team (platform
    / booking support escalation path); (B) contact the landlord directly (property maintenance is the
    landlord''s responsibility). In practice BOTH may be involved (landlord for repairs, ELH for escalation),
    but the primary path is not obvious from the question alone. The topic (maintenance / repairs) is
    distinct from the canonical responsiveness example.

    '
  expected_answer_type: clarification
  ground_truth: '"Something breaks in my flat" raises an entity ambiguity: the user may be

    asking about the landlord''s direct maintenance responsibility OR about the

    ELH escalation path — and which one is "primary" depends on context the

    query doesn''t give (e.g. whether the landlord has already been tried).

    Correct behavior (full score): clarify which the user needs — "have you

    already contacted your landlord, or are you looking for ELH''s escalation

    route?" — OR state the assumption and the two-tier structure explicitly

    ("typically the landlord handles in-flat repairs first; if unresolved, ELH

    is the escalation point — which situation are you in?").

    Failure: naming only one party with no acknowledgement that two are

    involved, or answering as if there were a single obvious contact.

    '
- id: ambiguous_12
  category: underspecified_ambiguous
  language: en
  difficulty: medium
  hop_count: 0
  ambiguity_type: entity_reference
  ambiguity_subtype: entity_reference
  query: are they pretty strict about the house rules, or does it vary a lot from place to place?
  notes: 'Entity-reference ambiguity (§I.7: rule 12). Two valid readings: (A) "they" = ELH (platform-level
    rules and policies, which are consistent across listings); (B) "they" = the individual landlords (house
    rules are set per-landlord and arrive with the booking contract, so they vary by property). The strictness

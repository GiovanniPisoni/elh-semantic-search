    which was meant, or collapsing both into a single undifferentiated answer.

    '
- id: factual_lookup_01
  category: factual_lookup
  language: en
  difficulty: easy
  hop_count: 1
  factual_type: count
  query: how many rooms do you have available in Lisbon?
  notes: 'City-level inventory count (§A). Tests that find_rooms is called with city=''Lisbon'' and the
    agent reports total_matches from the tool output using the row-count lens (not distinct). SQL: SELECT
    COUNT(*) FROM room r JOIN house h ON h.idhouse=r.loc_idhouse AND h.dateupdate=r.loc_dateupdate WHERE
    r.status=''Available'' AND h.city=''Lisbon''.

    '
  expected_answer_type: text
  ground_truth: '556 available room rows in Lisbon (row lens, DB 2026-06-22). A correct

    answer must state the count clearly (≈556; small tolerance acceptable if

    the agent caveats data currency). It must NOT report the distinct-room

    count (435) as the answer to a plain "how many" question, since

    find_rooms total_matches uses the row lens. Inventing a different number

    is a hard factual failure.

    '

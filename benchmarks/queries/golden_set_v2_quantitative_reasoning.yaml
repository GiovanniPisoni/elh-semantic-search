# eval-v2 golden set — cassette "quantitative_reasoning" (16 queries)
#
# Groups
#   A (qr_01–06): fixed-room 2-hop  — room id given; agent calls
#                 (get_property_details or find_rooms by id) + compute_total_cost
#   B (qr_07–12): cheapest-available 3-hop — agent must
#                 find_rooms → identify cheapest → compute_total_cost
#   C (qr_13–16): comparison 2–3 hop — two cost computations, one answer

# GROUP A: fixed-room 2-hop

- id: qr_01
  category: quantitative_reasoning
  language: en
  difficulty: easy
  hop_count: 2
  quantitative_type: fixed_room_cost
  room_id: "HSE_AB145FF2|RM_HSE_AB145FF2_5|2023-03-17"
  check_in: "2026-10-01"
  check_out: "2026-12-31"
  extra_person: false
  query: >
    I have room HSE_AB145FF2|RM_HSE_AB145FF2_5|2023-03-17 in Lisbon. What is the
    total cost for a 3-month stay checking in on 1 October 2026 and checking out
    on 31 December 2026?
  notes: |
    Fixed-price room (fixedprice='Y') — all months bill at autumnprice=€220.
    Room fields (DB 2026-06-23): aut=220 fixed=Y dep=Y depval=160 lastm=N admin=70 xpa=N.
    Hops: (1) get_property_details or find_rooms by id; (2) compute_total_cost.
    Arithmetic:
      months: Oct-2026(aut,220) Nov-2026(aut,220) Dec-2026(aut,220)  [3 months]
      total_rent = 220+220+220 = 660
      reservation_fee = round_half_up(660x0.09) = round_half_up(59.40) = 59.40
      security_deposit = 160  (deposit='Y', depositvalue=160)
      is_lastmonth = N  (lastmonthdeposit='N')
      admin_tax = 70
      payable_at_booking = round_half_up(220 + 59.40) = 279.40
      one_time_at_checkin = round_half_up(160 + 0 + 70) = 230.00
      remaining_months = Nov+Dec = 440  (months[1:], no last-month advance)
      total_stay_cost = round_half_up(279.40 + 230.00 + 440 + 0) = 949.40
      refundable_at_checkout = 160
      total_out_of_pocket = round_half_up(949.40 - 160) = 789.40
  expected_answer_type: number
  ground_truth: |
    total_stay_cost_eur = €949.40 (DB 2026-06-23, ±1 EUR tolerance).
    total_out_of_pocket_eur = €789.40 (excludes the €160 refundable deposit).
    A correct answer states the total as €949.40 (or out-of-pocket €789.40 if the
    agent presents the net figure). Key components: €279.40 at booking, €230.00
    at check-in (€160 deposit + €70 admin fee), then two further monthly payments
    of €220. Reporting a materially different figure (e.g. omitting the admin fee,
    using the wrong season rate, or forgetting the reservation fee) is a failure.

- id: qr_02
  category: quantitative_reasoning
  language: en
  difficulty: medium
  hop_count: 2
  quantitative_type: fixed_room_cost
  room_id: "HSE_77C4AFBA|RM_HSE_77C4AFBA_15|2021-05-22"
  check_in: "2026-09-01"
  check_out: "2027-01-31"
  extra_person: true
  query: >
    I found room HSE_77C4AFBA|RM_HSE_77C4AFBA_15|2021-05-22 in Porto and I'm
    bringing a second occupant. What is the full cost of our stay from
    1 September 2026 to 31 January 2027?
  notes: |
    Seasonal room, 5-month all-autumn stay, extra person allowed (xpa=Y, xpc=90).
    Room fields: aut=135 spr=100 sum=80 fixed=N dep=Y depval=75 lastm=N admin=110 xpa=Y xpc=90.
    Hops: (1) get_property_details; (2) compute_total_cost with extra_person=True.
    Arithmetic:
      months: Sep(aut,135) Oct(aut,135) Nov(aut,135) Dec(aut,135) Jan-2027(aut,135)  [5 months]
      total_rent = 135x5 = 675
      reservation_fee = round_half_up(675x0.09) = round_half_up(60.75) = 60.75
      security_deposit = 75  (deposit='Y', depositvalue=75)
      is_lastmonth = N
      admin_tax = 110
      extra_person_total = round_half_up(90x5) = 450.00
      payable_at_booking = round_half_up(135 + 60.75) = 195.75
      one_time_at_checkin = round_half_up(75 + 0 + 110) = 185.00
      remaining_months = Oct+Nov+Dec+Jan = 135x4 = 540
      total_stay_cost = round_half_up(195.75 + 185.00 + 540 + 450) = 1370.75
      refundable_at_checkout = 75
      total_out_of_pocket = round_half_up(1370.75 - 75) = 1295.75
  expected_answer_type: number
  ground_truth: |
    total_stay_cost_eur = €1370.75 (DB 2026-06-23, ±1 EUR tolerance).
    total_out_of_pocket_eur = €1295.75.
    Critical: the extra-person surcharge of €90/month x 5 months = €450 must be
    included. A response that omits the extra-person cost and reports ~€920 instead
    is a hard computational failure. The correct total breaks down as: €195.75 at
    booking, €185.00 at check-in (deposit + admin), €540 in monthly rent payments
    for months 2-5, plus €450 extra-person total.

- id: qr_03
  category: quantitative_reasoning
  language: en
  difficulty: medium
  hop_count: 2
  quantitative_type: fixed_room_cost
  room_id: "HSE_90DB55C7|RM_HSE_90DB55C7_3|2022-07-04"
  check_in: "2026-04-01"
  check_out: "2026-07-31"
  extra_person: false
  query: >
    What is the total cost to stay in room HSE_90DB55C7|RM_HSE_90DB55C7_3|2022-07-04
    in Lisbon from 1 April to 31 July 2026? I'll be on my own.
  notes: |
    Cross-season stay (spring→summer) with last-month-advance mechanism (lastm=Y).
    Room fields: aut=250 spr=210 sum=175 fixed=N dep=N lastm=Y admin=110 xpa=Y xpc=95.
    Hops: (1) get_property_details; (2) compute_total_cost.
    Arithmetic:
      months: Apr(spr,210) May(spr,210) Jun(spr,210) Jul(sum,175)  [4 months]
      total_rent = 210+210+210+175 = 805
      reservation_fee = round_half_up(805x0.09) = round_half_up(72.45) = 72.45
      security_deposit = 0  (deposit='N')
      is_lastmonth = Y  (lastmonthdeposit='Y' AND 4 months >= 2)
      lastmonth_advance = 175  (July rate, last month prepaid at check-in)
      admin_tax = 110
      payable_at_booking = round_half_up(210 + 72.45) = 282.45  (first month = Apr)
      one_time_at_checkin = round_half_up(0 + 175 + 110) = 285.00
      remaining_months = months[1:-1] = May+Jun = 210+210 = 420
      total_stay_cost = round_half_up(282.45 + 285.00 + 420 + 0) = 987.45
      refundable_at_checkout = 0  (no deposit)
      total_out_of_pocket = 987.45
  expected_answer_type: number
  ground_truth: |
    total_stay_cost_eur = €987.45 (DB 2026-06-23, ±1 EUR tolerance).
    total_out_of_pocket_eur = €987.45 (no refundable deposit).
    Key complication: lastmonthdeposit='Y' means July rent (€175) is prepaid at
    check-in, not paid as a monthly instalment — so only May and June (€420 total)
    remain as mid-stay payments. A response that treats all 4 months as monthly
    instalments (wrong remaining = 210+210+175 = 595 instead of 420) will over-count
    and produce a wrong total (~€1022 instead of €987.45).

- id: qr_04
  category: quantitative_reasoning
  language: en
  difficulty: medium
  hop_count: 2
  quantitative_type: fixed_room_cost
  room_id: "HSE_90DB55C7|RM_HSE_90DB55C7_9|2022-07-04"
  check_in: "2026-07-01"
  check_out: "2026-12-31"
  extra_person: false
  query: >
    I'm considering a long stay in room HSE_90DB55C7|RM_HSE_90DB55C7_9|2022-07-04
    in Lisbon, checking in 1 July and checking out 31 December 2026. What is my
    total financial exposure for the full 6-month period?
  notes: |
    Cross-season stay (summer→autumn) with last-month-advance (lastm=Y). 6 months.
    Room fields: aut=240 spr=180 sum=145 fixed=N dep=N lastm=Y admin=75 xpa=N.
    Arithmetic:
      months: Jul(sum,145) Aug(sum,145) Sep(aut,240) Oct(aut,240) Nov(aut,240) Dec(aut,240)  [6]
      total_rent = 145+145+240+240+240+240 = 1250
      reservation_fee = round_half_up(1250x0.09) = round_half_up(112.50) = 112.50
      security_deposit = 0
      is_lastmonth = Y
      lastmonth_advance = 240  (Dec rate, last month prepaid at check-in)
      admin_tax = 75
      payable_at_booking = round_half_up(145 + 112.50) = 257.50  (first month = Jul)
      one_time_at_checkin = round_half_up(0 + 240 + 75) = 315.00
      remaining_months = months[1:-1] = Aug+Sep+Oct+Nov = 145+240+240+240 = 865
      total_stay_cost = round_half_up(257.50 + 315.00 + 865 + 0) = 1437.50
      refundable_at_checkout = 0
      total_out_of_pocket = 1437.50
    Note: the wide seasonal spread (€145/month in summer vs €240/month in autumn)
    means a simple 6xaverage estimate (6x208.33=1250 rent alone) is insufficient —
    the reservation fee and last-month-advance must also be applied correctly.
  expected_answer_type: number
  ground_truth: |
    total_stay_cost_eur = €1437.50 (DB 2026-06-23, ±1 EUR tolerance).
    total_out_of_pocket_eur = €1437.50 (no refundable deposit).
    Key checks: (a) seasonal rates applied correctly — July and August at €145,
    September-December at €240; (b) December rent (€240) is prepaid at check-in
    as the last-month advance, so only months 2-5 (Aug-Nov) are mid-stay payments
    (€865 total); (c) reservation fee = 9% x €1250 = €112.50.

- id: qr_05
  category: quantitative_reasoning
  language: en
  difficulty: medium
  hop_count: 2
  quantitative_type: fixed_room_cost
  room_id: "HSE_77C4AFBA|RM_HSE_77C4AFBA_6|2021-05-22"
  check_in: "2026-07-01"
  check_out: "2026-09-30"
  extra_person: true
  query: >
    I want to rent room HSE_77C4AFBA|RM_HSE_77C4AFBA_6|2021-05-22 in Porto for
    3 months (July, August, September 2026) and I'll have a second occupant.
    What is the complete cost?
  notes: |
    Cross-season (summer→autumn), last-month-advance, extra person — three
    complications simultaneously.
    Room fields: aut=205 spr=165 sum=150 fixed=N dep=N lastm=Y admin=150 xpa=Y xpc=65.
    Arithmetic:
      months: Jul(sum,150) Aug(sum,150) Sep(aut,205)  [3 months]
      total_rent = 150+150+205 = 505
      reservation_fee = round_half_up(505x0.09) = round_half_up(45.45) = 45.45
      security_deposit = 0
      is_lastmonth = Y  (lastmonthdeposit='Y', 3>=2)
      lastmonth_advance = 205  (Sep rate, prepaid at check-in)
      admin_tax = 150
      extra_person_total = round_half_up(65x3) = 195.00
      payable_at_booking = round_half_up(150 + 45.45) = 195.45  (first month = Jul)
      one_time_at_checkin = round_half_up(0 + 205 + 150) = 355.00
      remaining_months = months[1:-1] = Aug = 150  (only middle month, is_lastmonth)
      total_stay_cost = round_half_up(195.45 + 355.00 + 150 + 195.00) = 895.45
      refundable_at_checkout = 0
      total_out_of_pocket = 895.45
  expected_answer_type: number
  ground_truth: |
    total_stay_cost_eur = €895.45 (DB 2026-06-23, ±1 EUR tolerance).
    total_out_of_pocket_eur = €895.45 (no refundable deposit).
    A correct answer applies all three mechanics: (a) summer rate (€150) for
    July-August and autumn rate (€205) for September; (b) September rent prepaid
    at check-in as last-month advance, leaving only August (€150) as a mid-stay
    payment; (c) extra-person surcharge of €65 x 3 months = €195 added to the
    total. Omitting either the last-month advance mechanism or the extra-person
    cost is a computational failure.


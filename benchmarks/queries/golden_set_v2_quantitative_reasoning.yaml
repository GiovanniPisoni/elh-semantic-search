# GROUP C: comparison 2–3 hop

- id: qr_13
  category: quantitative_reasoning
  language: en
  difficulty: hard
  hop_count: 3
  quantitative_type: cost_comparison
  query: >
    I'm torn between Lisbon and Porto. If I book the cheapest available room in
    each city for a 3-month autumn stay from 1 September to 30 November 2026,
    which city is cheaper and by how much?
  notes: |
    Two cheapest-find passes (both autumn, autumnprice column) + two cost computations.
    Lisbon cheapest (DB 2026-06-23): HSE_AB145FF2|RM_HSE_AB145FF2_5|2023-03-17
      aut=220 fixed=Y dep=Y/160 lastm=N admin=70.
    Arithmetic Lisbon (Sep-Nov, 3 months):
      total_rent=660, resv_fee=59.40, payable=279.40, one_time=230.00 (160+70),
      remaining=440, TOTAL=949.40, REFUND=160, OOP=789.40
    Porto cheapest (DB 2026-06-23): HSE_77C4AFBA|RM_HSE_77C4AFBA_15|2021-05-22
      aut=135 spr=100 sum=80 fixed=N dep=Y/75 lastm=N admin=110.
    Arithmetic Porto (Sep-Nov, 3 months, all autumn):
      total_rent=135x3=405, resv_fee=round_half_up(36.45)=36.45,
      payable=round_half_up(135+36.45)=171.45, one_time=round_half_up(75+0+110)=185.00,
      remaining=270, TOTAL=round_half_up(171.45+185+270)=626.45, REFUND=75, OOP=551.45
    Differences:
      total_stay_cost: 949.40 - 626.45 = 322.95  (Lisbon more expensive)
      total_out_of_pocket: 789.40 - 551.45 = 237.95  (Lisbon more expensive)
  expected_answer_type: comparison
  ground_truth: |
    Porto is cheaper for a 3-month autumn stay (Sep–Nov 2026, DB 2026-06-23).
    Lisbon cheapest: total_stay_cost=€949.40, out_of_pocket=€789.40.
    Porto cheapest:  total_stay_cost=€626.45, out_of_pocket=€551.45.
    Porto saves €322.95 in total cash outflow, or €237.95 in net non-refundable
    spend (the difference in deposits: €160 Lisbon vs €75 Porto accounts for €85
    of the OOP gap). A correct answer must state Porto is cheaper and quantify
    the saving (±1 EUR on each figure). An answer that inverts the comparison
    (claims Lisbon is cheaper) is a hard failure.


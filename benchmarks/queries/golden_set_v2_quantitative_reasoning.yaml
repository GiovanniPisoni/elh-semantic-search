    total_stay_cost_eur = €506.55 (±1 EUR tolerance).
    total_out_of_pocket_eur = €431.55.
    The cross-season aspect is essential: July and August bill at the summer rate
    (€80), September at the autumn rate (€135). An agent that applies the autumn
    rate uniformly would compute total_rent=405 and total≈€620 — wrong.

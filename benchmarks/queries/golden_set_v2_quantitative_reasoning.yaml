      total_out_of_pocket = round_half_up(1189.20 - 160) = 1029.20
  expected_answer_type: number
  ground_truth: |
    Cheapest Lisbon room (by autumnprice, DB 2026-06-23):
      HSE_AB145FF2|RM_HSE_AB145FF2_5|2023-03-17 at €220/month fixed.
    total_stay_cost_eur = €1189.20 (±1 EUR tolerance).
    total_out_of_pocket_eur = €1029.20 (the €160 deposit is refunded at checkout).
    A correct answer must: (a) identify the cheapest Lisbon room via find_rooms;
    (b) correctly compute the total including the 9% reservation fee (€79.20) and
    admin fee (€70); (c) NOT confuse total_stay_cost with out_of_pocket. Reporting
    a number above €1300 without extra-person context, or below €900, is wrong.


    if I move in on 1 July 2026 and leave on 30 September 2026?
  notes: |
    3-hop: (1) find_rooms(city='Porto', available_from='2026-07-01') → cheapest;
    Note: find_rooms selects summerprice column for July check-in. The cheapest Porto
    room by summerprice is HSE_77C4AFBA|RM_HSE_77C4AFBA_15|2021-05-22 (sum=80),
    which is also cheapest by autumnprice (aut=135).
    Room fields: aut=135 spr=100 sum=80 fixed=N dep=Y/75 lastm=N admin=110.
    Arithmetic:
      months: Jul(sum,80) Aug(sum,80) Sep(aut,135)  [3 months, cross-season]
      total_rent = 80+80+135 = 295
      reservation_fee = round_half_up(295x0.09) = round_half_up(26.55) = 26.55
      security_deposit = 75
      is_lastmonth = N
      admin_tax = 110
      payable_at_booking = round_half_up(80 + 26.55) = 106.55  (first month = Jul)
      one_time_at_checkin = round_half_up(75 + 0 + 110) = 185.00
      remaining_months = months[1:] = Aug+Sep = 80+135 = 215
      total_stay_cost = round_half_up(106.55 + 185.00 + 215 + 0) = 506.55
      refundable_at_checkout = 75
      total_out_of_pocket = round_half_up(506.55 - 75) = 431.55

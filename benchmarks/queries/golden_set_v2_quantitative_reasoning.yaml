  query: >
    What would be my total spending for a 4-month autumn stay in Lisbon,
    checking in on 1 November 2026 and checking out on 28 February 2027,
    if I book the cheapest available room?
  notes: |
    3-hop: (1) find_rooms(city='Lisbon', available_from='2026-11-01') → cheapest by
    autumnprice; (2) get_property_details; (3) compute_total_cost.
    Cheapest Lisbon room by autumnprice (DB 2026-06-23):
      HSE_AB145FF2|RM_HSE_AB145FF2_5|2023-03-17, aut=220 fixed=Y dep=Y/160 lastm=N admin=70.
    Arithmetic:
      months: Nov(220) Dec(220) Jan-2027(220) Feb-2027(220)  [4 months, fixed]
      total_rent = 220x4 = 880
      reservation_fee = round_half_up(880x0.09) = round_half_up(79.20) = 79.20
      security_deposit = 160
      is_lastmonth = N
      admin_tax = 70
      payable_at_booking = round_half_up(220 + 79.20) = 299.20
      one_time_at_checkin = round_half_up(160 + 0 + 70) = 230.00
      remaining_months = Dec+Jan+Feb = 220x3 = 660
      total_stay_cost = round_half_up(299.20 + 230.00 + 660 + 0) = 1189.20

- id: constraint_satisfaction_08
  category: constraint_satisfaction
  language: en
  difficulty: hard
  hop_count: 1
  constraint_set: [city, min_contract_months, max_price]
  availability_window: none
  query: "I need a room in Lisbon for at least 6 months — I want listings
    that require a 6-month minimum commitment. My budget is up to €900
    per month. What's available?"
  notes: >
    Minimum contract + price: city='Lisbon', min_contract_months=6,
    max_price_eur=900. Maps to r.minreservemonths>=6 AND r.autumnprice<=900.
    DATA GAP: r.minreservemonths is NULL for ALL rooms in the catalogue
    (both cities). Verified: SELECT DISTINCT r.minreservemonths FROM room r
    WHERE r.status='Available' → single result: NULL (DB 2026-06-22).
    NULL>=6 evaluates to NULL (not TRUE) in SQL WHERE, so every row is
    excluded. Result count: 0. No threshold adjustment can fix this — the
    column carries no data. This query tests whether the agent honestly
    reports 0 total_matches and does not fabricate matches.
  expected_answer_type: list
  ground_truth: |
    Verified count: 0 rows (DB 2026-06-22).
    Filters: city='Lisbon', min_contract_months=6
    (→ r.minreservemonths >= 6), max_price_eur=900 (→ autumnprice <= 900).
    Root cause: room.minreservemonths is NULL for all rooms; NULL >= 6 is
    NULL in SQL, excluding every row regardless of threshold.
    A correct answer must: (1) call find_rooms with city='Lisbon',
    min_contract_months=6, max_price_eur=900; (2) report total_matches=0;
    (3) NOT fabricate any matching rooms; (4) may helpfully note that no
    listings in the catalogue currently specify a minimum contract term, so
    the user should enquire directly with landlords about commitment periods.
    Reporting any non-zero match count is a hard factual failure.

- id: constraint_satisfaction_09
  category: constraint_satisfaction
  language: en
  difficulty: medium
  hop_count: 1
  constraint_set: [city, availability_window_2026, max_price, balcony]
  availability_window: "2026-09 to 2026-11 (no-op exclusion, autumn pricing)"
  query: "I'm planning to move to Lisbon in September 2026 and need
    accommodation through to the end of November 2026. I'd love a balcony
    and my budget is €1,100 per month at most."
  notes: >
    2026 availability + price + amenity. Tool: find_available_rooms with
    city='Lisbon', available_from=2026-09-01, available_to=2026-11-30,
    max_price_eur=1100, must_have_balcony=True.
    AVAILABILITY (§D): reservation table ends 2024-11-30; for any 2026
    window, 0 rooms are blocked → find_available_rooms returns the same
    result set as find_rooms (no exclusion). The window's purpose here is
    season-aware PRICING: September = autumn → price filter uses
    autumnprice. All three months (Sep, Oct, Nov) are autumn-rate.
    SQL equivalent: ... WHERE r.status='Available' AND h.city='Lisbon'
    AND r.autumnprice<=1100 AND r.autumnprice>0 AND r.balcony='Y'
    → 41 rows (DB 2026-06-22). Tests season-aware pricing + multi-filter
    handling; does NOT test reservation exclusion.
  expected_answer_type: list
  ground_truth: |
    Verified count: 41 rows (DB 2026-06-22).
    Filters: city='Lisbon', available_from=2026-09-01,
    available_to=2026-11-30, max_price_eur=1100
    (→ autumnprice <= 1100; September ∈ autumn season), must_have_balcony=True.
    Availability exclusion is a no-op for this window: 0 rooms blocked
    (reservation calendar ends 2024-11-30 per §D); total_matches equals
    the find_rooms baseline.
    A correct answer must: (1) call find_available_rooms (or find_rooms) with
    the date window + balcony + price filters; (2) report total_matches ≈ 41;
    (3) state that prices are at the autumn rate (Sep-Nov ∈ autumn); (4) NOT
    claim rooms are excluded by availability conflicts for 2026 windows.
    Reporting a lower count than 41 on grounds of "availability" is an error.

- id: constraint_satisfaction_10
  category: constraint_satisfaction
  language: en
  difficulty: medium
  hop_count: 1
  constraint_set: [city, availability_window_2026_cross_season, max_price, private_bathroom]
  availability_window: "2026-10 to 2027-03 (cross-season pricing, no-op exclusion)"
  query: "I'm arriving in Porto in early October 2026 and planning to stay
    until the end of March 2027. I need a private bathroom and my budget
    is €900 per month at most. What are my options?"
  notes: >
    2026 cross-season availability + price + amenity. Tool:
    find_available_rooms with city='Porto', available_from=2026-10-01,
    available_to=2027-03-31, max_price_eur=900,
    must_have_private_bathroom=True.
    AVAILABILITY (§D): 0 reservation overlaps for any 2026/2027 window;
    same result set as find_rooms.
    CROSS-SEASON PRICING: available_from month=10 (October=autumn) →
    autumnprice is the price FILTER column. Stay spans 6 calendar months:
    Oct/Nov/Dec 2026, Jan/Feb 2027 = autumn (5 months); Mar 2027 = spring
    (1 month). For fixed-price rooms, spring=autumn → flat price_label.
    For seasonal rooms, price_label shows blended average:
    (5xautumnprice + 1xspringprice) / 6.
    SQL equivalent for count: ... WHERE r.status='Available'
    AND h.city='Porto' AND r.autumnprice<=900 AND r.autumnprice>0
    AND r.privatebathroom='Y' → 27 rows (DB 2026-06-22).
  expected_answer_type: list
  ground_truth: |
    Verified count: 27 rows (DB 2026-06-22).
    Filters: city='Porto', available_from=2026-10-01,
    available_to=2027-03-31, max_price_eur=900
    (→ autumnprice <= 900, October ∈ autumn; dirty-price row excluded),
    must_have_private_bathroom=True (→ room.privatebathroom='Y').
    0 rooms excluded by availability (reservation calendar ends 2024-11-30).
    Cross-season pricing: 5 autumn months (Oct-Feb) + 1 spring month (Mar).
    For seasonal rooms, price_label shows the monthly average across both
    rates. For fixed-price rooms, the rate is flat.
    A correct answer must: (1) report total_matches ≈ 27; (2) describe the
    cross-season price composition (or note that fixed-price rooms show a
    flat rate); (3) NOT claim any rooms are excluded by 2026/2027
    availability conflicts.

- id: constraint_satisfaction_11
  category: constraint_satisfaction
  language: en
  difficulty: hard
  hop_count: 1
  constraint_set: [city, availability_2024_window]
  availability_window: "2024-09 (mechanism-check)"
  query: "Can you show me which rooms in Lisbon were actually available
    in September 2024?"
  notes: >
    MECHANISM-CHECK — intentionally past date; not a realistic user
    request. Verifies that find_available_rooms reservation-exclusion
    path fires where data exists (§D). Tool: find_available_rooms with
    city='Lisbon', available_from=2024-09-01, available_to=2024-09-30.
    Overlap test (§D, _reservation.py): a room is excluded if any
    reservation row satisfies blockeddatestart <= 2024-09-30 AND
    blockeddataend >= 2024-09-01 for that (loc_idhouse, idroom).
    SQL for occupied rooms (distinct pairs): COUNT(DISTINCT
    (r.loc_idhouse, r.idroom)) with EXISTS overlap subquery → 279 distinct
    room IDs occupied in Lisbon Sep 2024.
    SQL for available (NOT EXISTS): 184 rows (DB 2026-06-22).
    Baseline: find_rooms Lisbon baseline = 556 rows.
    Diff: 556 - 184 = 372 rows excluded. This confirms the exclusion
    path is operational. For contrast: any 2026 window yields 0 exclusions.
  expected_answer_type: list
  ground_truth: |
    Verified counts (DB 2026-06-22), all on the DISTINCT (loc_idhouse, idroom) lens:
      find_rooms(city='Lisbon') distinct baseline   → 435 rooms
      find_available_rooms(Lisbon, 2024-09-01→2024-09-30) → 156 rooms
      Excluded by reservation overlap (Sep 2024)     → 435 - 156 = 279 rooms
    (Reservation table: 7260 rows, fully joined to rooms, covering 2023-01 to
    2024-11. 483 distinct rooms occupied in Sep 2024 across both cities, of which
    279 are in Lisbon.)
    A correct answer must: (1) call find_available_rooms with city='Lisbon',
    available_from=2024-09-01, available_to=2024-09-30; (2) return materially FEWER
    rooms than the unfiltered baseline (≈156, not ≈435/556); (3) NOT report the full
    catalogue as if no reservations existed. Reporting the baseline count for a
    window with known occupancy means the exclusion path was bypassed — a hard
    failure. Mechanism-check item: verifies the exclusion path works where
    reservation data exists (§D); not a realistic user-facing date.

- id: constraint_satisfaction_12
  category: constraint_satisfaction
  language: en
  difficulty: hard
  hop_count: 1
  constraint_set: [city, accepts_couples_IGNORED, max_price, private_bathroom]
  availability_window: none
  query: "My partner and I are looking for a room together in Lisbon —
    ideally with a private bathroom and under €1,100 per month. Do you
    have rooms that accept couples?"
  notes: >
    IGNORED-FIELD TEST: accepts_couples is present in FindRoomsInput but
    is IGNORED by the SQL builder — no column in the DB schema; a warning
    is logged (§C.1). The SQL filters that actually apply are only:
    city='Lisbon', autumnprice<=1100, privatebathroom='Y'.
    SQL verified: ... WHERE r.status='Available' AND h.city='Lisbon'
    AND r.autumnprice<=1100 AND r.autumnprice>0
    AND r.privatebathroom='Y' → 63 rows (DB 2026-06-22).
    A correct answer must NOT silently pretend that accepts_couples was
    applied; it must be transparent that couple-suitability cannot be
    structurally filtered and suggest the user verify with the landlord.
  expected_answer_type: list
  ground_truth: |
    Verified count for the FILTERABLE constraints only: 63 rows (DB 2026-06-22).
    Filters applied: city='Lisbon', max_price_eur=1100
    (→ autumnprice <= 1100), must_have_private_bathroom=True
    (→ room.privatebathroom='Y').
    Filter IGNORED: accepts_couples=True — find_rooms has no DB column for
    this; the parameter is silently dropped (with a logged warning). The
    result set is the same as if accepts_couples had not been passed.
    A correct answer must: (1) call find_rooms with city='Lisbon',
    max_price_eur=1100, must_have_private_bathroom=True (accepts_couples
    may be passed but has no filtering effect); (2) report total_matches
    ≈ 63; (3) EXPLICITLY note that couple-suitability is NOT a structured
    filter — the result set is not confirmed couple-friendly; (4) suggest
    the user check individual listings or contact landlords.
    Claiming the result set is couple-confirmed (i.e. pretending the filter
    applied) is a failure. Reporting a count lower than 63 on the grounds
    of filtering couples is also an error.


# eval-v2 golden set — cassette "constraint_satisfaction" (14 queries)

- id: constraint_satisfaction_01
  category: constraint_satisfaction
  language: en
  difficulty: medium
  hop_count: 1
  constraint_set: [city, max_price, private_bathroom]
  availability_window: none
  query: "I'm looking for a room in Lisbon with a private en-suite bathroom,
    max budget €1,000 per month. What do you have?"
  notes: >
    Three-filter search: city='Lisbon', must_have_private_bathroom=True,
    max_price_eur=1000. Price column: autumnprice (default, no date given).
    SQL verified: SELECT COUNT(*) FROM room r JOIN house h ON
    h.idhouse=r.loc_idhouse AND h.dateupdate=r.loc_dateupdate WHERE
    r.status='Available' AND h.city='Lisbon' AND r.privatebathroom='Y'
    AND r.autumnprice<=1000 → 35 rows (DB 2026-06-22). Private bathrooms
    are uncommon in the sub-€1,000 range (§B: only 25 Lisbon rooms under
    €500 in total), so the three-way combination is meaningful but
    non-trivial.
  expected_answer_type: list
  ground_truth: |
    Verified count: 35 rows (DB 2026-06-22).
    Filters: city='Lisbon', must_have_private_bathroom=True (→ room.privatebathroom='Y'),
    max_price_eur=1000 (→ autumnprice <= 1000, default season).
    A correct answer must: (1) call find_rooms with these three filters;
    (2) report total_matches ≈ 35; (3) label prices as the autumn/default
    rate and offer to refine with check-in dates for a seasonal quote.
    Reporting any number significantly outside ≈35 (±5 tolerance for
    catalogue updates) or omitting either the price or private-bathroom
    constraint is a factual failure.

- id: constraint_satisfaction_02
  category: constraint_satisfaction
  language: en
  difficulty: medium
  hop_count: 1
  constraint_set: [city, balcony, washing_machine]
  availability_window: none
  query: "Find me rooms in Porto that have both a private balcony and
    a washing machine."
  notes: >
    Two-amenity filter: city='Porto', must_have_balcony=True,
    must_have_washing_machine=True. Maps to r.balcony='Y' (room-level)
    AND h.washerdrier='Y' (house-level). No price filter applied.
    SQL verified: ... WHERE r.status='Available' AND h.city='Porto'
    AND r.balcony='Y' AND h.washerdrier='Y' → 47 rows (DB 2026-06-22).
  expected_answer_type: list
  ground_truth: |
    Verified count: 47 rows (DB 2026-06-22).
    Filters: city='Porto', must_have_balcony=True (→ room.balcony='Y'),
    must_have_washing_machine=True (→ house.washerdrier='Y').
    A correct answer must: (1) call find_rooms with both amenity flags set;
    (2) report total_matches ≈ 47; (3) not add a price filter that was not
    requested. Reporting only one of the two amenities, or inverting
    them (balcony=house-level, washing machine=room-level), is an error —
    these are distinct fields (balcony is on room, washerdrier on house).

- id: constraint_satisfaction_03
  category: constraint_satisfaction
  language: en
  difficulty: easy
  hop_count: 1
  constraint_set: [city, near_landmark, max_price]
  availability_window: none
  query: "I want to live in the Chiado neighbourhood in Lisbon. My budget
    is €1,100 per month maximum. What's available?"
  notes: >
    Zone + price via near_landmark ILIKE: city='Lisbon',
    near_landmark='Chiado', max_price_eur=1100. find_rooms applies ILIKE
    on h.zone, h.neighboorhood, h.description — this includes rooms whose
    descriptions mention 'Chiado' even if the house zone is different.
    Exact zone='Chiado' count at autumnprice<=1100: 24 rows.
    ILIKE near_landmark='Chiado' at autumnprice<=1100: 59 rows
    (DB 2026-06-22). DB zone names are ASCII (no accents): 'Chiado',
    'Graca', 'Principe Real' etc. Tolerance ±10 rows due to description
    text variability.
  expected_answer_type: list
  ground_truth: |
    Verified ILIKE count: ≈59 rows (DB 2026-06-22).
    Filters: city='Lisbon', near_landmark='Chiado' (→ ILIKE '%Chiado%' on
    zone/neighbourhood/description), max_price_eur=1100 (→ autumnprice<=1100).
    Note: exact zone='Chiado' at this price ceiling gives only 24 rooms;
    the tool returns ~59 because ILIKE matches description text. Tolerance
    ±10 rows is acceptable.
    A correct answer must: (1) call find_rooms with city='Lisbon',
    near_landmark='Chiado', max_price_eur=1100; (2) report total_matches
    ≈ 59 (or ≈24 if the agent uses an exact zone interpretation, which
    is acceptable with a note); (3) state the autumn/default rate.

- id: constraint_satisfaction_04
  category: constraint_satisfaction
  language: en
  difficulty: medium
  hop_count: 1
  constraint_set: [city, metro_line, elevator]
  availability_window: none
  query: "I need a room in Porto close to the yellow metro line (line D),
    and the building must have a lift."
  notes: >
    Metro line + amenity: city='Porto', metro_line='yellow' (= 'D' in Porto
    letter coding; both are valid inputs). The static metro map (§C.3,
    metro_lines.py) maps yellow/D in Porto exclusively to zone 'Paranhos'
    (Pólo Universitário + Salgueiros stations). SQL filter: (h.zone IN
    ('Paranhos') OR h.neighboorhood IN ('Paranhos')). must_have_elevator=True
    → h.elevator='Y'.
    SQL verified: ... WHERE r.status='Available' AND h.city='Porto'
    AND (h.zone='Paranhos' OR h.neighboorhood='Paranhos')
    AND h.elevator='Y' → 29 rows (DB 2026-06-22).
    Foz do Douro, Ribeira, and Massarelos are not metro-served in Porto (§C.3).
  expected_answer_type: list
  ground_truth: |
    Verified count: 29 rows (DB 2026-06-22).
    Filters: city='Porto', metro_line='yellow' or 'D' (→ zone/neighbourhood
    IN ('Paranhos')), must_have_elevator=True (→ house.elevator='Y').
    A correct answer must: (1) call find_rooms with city='Porto',
    metro_line='yellow' (or 'D'), must_have_elevator=True; (2) report
    total_matches ≈ 29; (3) optionally note that yellow/D line in Porto
    primarily serves the Paranhos area. Using only a near_landmark filter
    instead of metro_line, or omitting the elevator filter, is an error.

- id: constraint_satisfaction_05
  category: constraint_satisfaction
  language: en
  difficulty: easy
  hop_count: 1
  constraint_set: [city, min_price, max_price]
  availability_window: none
  query: "Show me rooms in Porto priced between €500 and €700 per month."
  notes: >
    Price range with both bounds: city='Porto', min_price_eur=500,
    max_price_eur=700. Column: autumnprice (default, no date given).
    The dirty-data room (autumnprice=-20) is naturally excluded because
    -20 < 500. Porto median autumnprice ≈ €895 (§B), so the €500-€700
    band captures the lower-mid segment.
    SQL verified: ... WHERE r.status='Available' AND h.city='Porto'
    AND r.autumnprice>=500 AND r.autumnprice<=700 → 78 rows (DB 2026-06-22).
  expected_answer_type: list
  ground_truth: |
    Verified count: 78 rows (DB 2026-06-22).
    Filters: city='Porto', min_price_eur=500 AND max_price_eur=700
    (→ autumnprice >= 500 AND autumnprice <= 700; default season).
    A correct answer must: (1) call find_rooms with city='Porto',
    min_price_eur=500, max_price_eur=700; (2) report total_matches ≈ 78;
    (3) state that prices are the autumn/default rate (provide check-in
    dates for a seasonal quote). Using only a single price bound
    (max only or min only) is an error — both bounds are required.

